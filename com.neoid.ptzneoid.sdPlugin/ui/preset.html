<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="sdpi-components.js"></script>
  <script src="./i18n.js"></script>
  <title>NEOiD PTZ - Preset</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="separate-field">
    <sdpi-item label="Preset Number">
      <sdpi-select setting="numberPreset" id="select-presets" default="none" placeholder="Select">
        <option value="none" disabled selected hidden>Select</option>
      </sdpi-select>
    </sdpi-item>
  </div>

  <div id="image-row">
    <sdpi-item label="Image">
      <sdpi-checkbox setting="image"></sdpi-checkbox>
    </sdpi-item>
  </div>

  <sdpi-item label="Camera IP Default">
    <sdpi-checkbox id="isDefault" setting="isDefault"></sdpi-checkbox>
  </sdpi-item>

  <div id="camera-form">
    <sdpi-item label="IP">
      <sdpi-textfield setting="cameraIPControls" placeholder="Camera IP: 192.168.100.88"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Camera Type">
      <sdpi-select setting="cameraType" default="neoid">
        <option value="neoid">NEOiD</option>
        <option value="telycam">Telycam</option>
      </sdpi-select>
    </sdpi-item>
  </div>

  <div class="pi-description">
    <p data-i18n="preset.description"></p>
    <p data-i18n="preset.ipDefault.description"></p>
    <p class="pi-note" data-i18n="preset.telycam.note"></p>
  </div>

  <script src="./ptz-settings.js"></script>
  <script>
    const select = document.getElementById("select-presets");
    for (let i = 1; i <= 64; i++) {
      const option = document.createElement("option");
      option.value = i;
      option.textContent = i;
      select.appendChild(option);
    }
    setupConditionalField('isDefault', 'camera-form', 'isDefault');

    (function () {
      const { streamDeckClient } = SDPIComponents;
      let currentSettings = {};
      let globalIsTelycam = false;

      function imageVisible() {
        if (currentSettings.isDefault) {
          return currentSettings.cameraType !== 'telycam';
        }
        return !globalIsTelycam;
      }

      function refreshImageRow() {
        const row = document.getElementById('image-row');
        if (row) row.style.display = imageVisible() ? '' : 'none';
      }

      streamDeckClient.didReceiveSettings.subscribe(({ payload }) => {
        currentSettings = payload.settings;
        refreshImageRow();
      });

      streamDeckClient.didReceiveGlobalSettings.subscribe(({ payload }) => {
        globalIsTelycam = !!payload.settings.isTelycam;
        refreshImageRow();
      });

      (async () => {
        const [{ settings }, globalPayload] = await Promise.all([
          streamDeckClient.getSettings(),
          streamDeckClient.getGlobalSettings()
        ]);
        currentSettings = settings;
        globalIsTelycam = !!globalPayload.settings.isTelycam;
        refreshImageRow();
      })();
    })();
  </script>
</body>
</html>
