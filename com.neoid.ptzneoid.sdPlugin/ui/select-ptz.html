<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="sdpi-components.js"></script>
  <script src="./i18n.js"></script>
  <title>NEOiD PTZ - Select Camera</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="separate-field">
    <sdpi-item label="Name">
      <sdpi-textfield setting="camera" placeholder="Add name"></sdpi-textfield>
    </sdpi-item>

    <div id="camera-form">
      <sdpi-item label="Camera IP">
        <sdpi-textfield setting="cameraIP" placeholder="IP: 192.168.100.88"></sdpi-textfield>
      </sdpi-item>
    </div>
  </div>

  <sdpi-item label="NEOiD By Telycam">
    <sdpi-checkbox id="isTelycam" setting="isTelycam"></sdpi-checkbox>
  </sdpi-item>

  <div id="tally-field">
    <sdpi-item label="Tally Feedback">
      <sdpi-checkbox setting="showTally"></sdpi-checkbox>
    </sdpi-item>
  </div>

  <div id="telycam-credentials" style="display: none;">
    <sdpi-item label="User">
      <sdpi-textfield setting="telycamUser" placeholder="neoid"></sdpi-textfield>
    </sdpi-item>

    <sdpi-item label="Password">
      <sdpi-password setting="telycamPassword"></sdpi-password>
    </sdpi-item>
  </div>

  <div class="pi-description">
    <p data-i18n="select.description"></p>
    <p data-i18n="select.pgm.description"></p>
    <p class="pi-note" data-i18n="select.telycam.note"></p>
  </div>

  <script src="./ptz-settings.js"></script>
  <script>
    setupConditionalField('isTelycam', 'telycam-credentials', 'isTelycam');

    (function () {
      const { streamDeckClient } = SDPIComponents;
      const tallyField = document.getElementById('tally-field');

      function updateTallyVisibility(isTelycam) {
        if (tallyField) tallyField.style.display = isTelycam ? 'none' : '';
      }

      const isTelycamCheckbox = document.getElementById('isTelycam');
      const innerInput = isTelycamCheckbox?.shadowRoot?.querySelector('input[type="checkbox"]');
      if (innerInput) {
        innerInput.addEventListener('change', () => updateTallyVisibility(innerInput.checked));
      }

      streamDeckClient.didReceiveSettings.subscribe(({ payload }) => {
        updateTallyVisibility(!!payload.settings.isTelycam);
      });

      (async () => {
        const { settings } = await streamDeckClient.getSettings();
        updateTallyVisibility(!!settings.isTelycam);
      })();
    })();
  </script>
</body>
</html>
