<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="sdpi-components.js"></script>
  <script src="./i18n.js"></script>
  <title>NEOiD PTZ - OSD Menu</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h3>NEOiD PTZ Deck - OSD Menu</h3>

  <div id="separate-field">
    <sdpi-item label="OSD">
      <sdpi-select setting="mode" default="none" placeholder="Select">
        <option value="none" disabled selected hidden>Select</option>
        <optgroup label="Mode">
          <option value="OSD">OSD</option>
          <option value="back">OSD Back</option>
          <option value="enter">OSD Enter</option>
        </optgroup>
      </sdpi-select>
    </sdpi-item>
  </div>

  <div class="pi-description">
    <p data-i18n="osd.description"></p>
  </div>

  <script src="./ptz-settings.js"></script>
</body>
</html>
