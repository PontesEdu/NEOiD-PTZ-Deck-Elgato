<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="sdpi-components.js"></script>
  <script src="./i18n.js"></script>
  <title>NEOiD PTZ - Zoom</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h3>NEOiD PTZ Deck - Zoom</h3>

  <div id="separate-field">
    <sdpi-item label="Zoom">
      <sdpi-select setting="direction" default="none" placeholder="Select">
        <option value="none" disabled selected hidden>Select</option>
        <option value="zoomin">Zoom in</option>
        <option value="zoomout">Zoom out</option>
      </sdpi-select>
    </sdpi-item>
  </div>

  <div class="pi-description">
    <p data-i18n="zoom.description"></p>
  </div>

  <script src="./ptz-settings.js"></script>
</body>
</html>
