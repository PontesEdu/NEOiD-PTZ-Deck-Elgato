<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="sdpi-components.js"></script>
  <script src="./i18n.js"></script>
  <title>NEOiD PTZ - Controls</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h3>NEOiD PTZ Deck - Controls PTZ</h3>

  <div id="separate-field">
    <sdpi-item label="Direction">
      <sdpi-select setting="direction" default="none" placeholder="Select direction">
        <option value="none" disabled selected hidden>Select Controls</option>
        <option value="home">Home</option>
        <option value="up">Up</option>
        <option value="down">Down</option>
        <option value="left">Left</option>
        <option value="right">Right</option>
        <option value="leftup">Left Up</option>
        <option value="leftdown">Left Down</option>
        <option value="rightup">Right Up</option>
        <option value="rightdown">Right Down</option>
      </sdpi-select>
    </sdpi-item>

    <sdpi-item label="Camera IP Default">
      <sdpi-checkbox id="isDefault" setting="isDefault"></sdpi-checkbox>
    </sdpi-item>

    <div id="camera-form">
      <sdpi-item label="IP">
        <sdpi-textfield setting="cameraIPControls" placeholder="Camera IP: 192.168.100.88"></sdpi-textfield>
      </sdpi-item>
    </div>
  </div>

  <div class="pi-description">
    <p data-i18n="controls.description"></p>
    <p data-i18n="controls.ipDefault.description"></p>
    <p class="pi-note" data-i18n="controls.telycam.note"></p>
  </div>

  <script src="./ptz-settings.js"></script>
  <script>setupConditionalField('isDefault', 'camera-form', 'isDefault');</script>
</body>
</html>
