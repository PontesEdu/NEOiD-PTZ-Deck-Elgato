<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="sdpi-components.js"></script>
  <script src="./i18n.js"></script>
  <title>NEOiD PTZ - Focus</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h3>NEOiD PTZ Deck - Focus</h3>

  <div id="separate-field">
    <sdpi-item label="Focus">
      <sdpi-select setting="mode" default="none" placeholder="Select">
        <option value="none" disabled selected hidden>Select</option>
        <option value="focusin">Near</option>
        <option value="focusout">Far</option>
        <option value="afocus">Auto Focus</option>
      </sdpi-select>
    </sdpi-item>
  </div>

  <div class="pi-description">
    <p data-i18n="focus.description"></p>
  </div>

  <script src="./ptz-settings.js"></script>
</body>
</html>
